name: Build APK

# Roda sozinho a cada mudança na branch main.
# Também dá para rodar na mão: aba Actions > Build APK > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # O projeto está dentro da pasta "asc-live-main" do repositório.
    defaults:
      run:
        working-directory: asc-live-main
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O Android SDK já vem instalado no ubuntu-latest. O passo "setup-android" quebrava
      # (erro "Failed to find package 'tools'"), então foi removido. Aqui só aceitamos as licenças.
      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: asc-live-main

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Alinhar e assinar o APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Assinando com a sua chave (Secrets)."
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            "$BT/apksigner" sign --ks release.jks \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --out ASC-Live.apk aligned.apk
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "Sem os 4 Secrets: assinando com chave de teste (o APK NAO sera publicado)."
            keytool -genkeypair -keystore test.jks -storepass testtest -keypass testtest \
              -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=ASC Live Teste"
            "$BT/apksigner" sign --ks test.jks --ks-pass pass:testtest --key-pass pass:testtest \
              --ks-key-alias test --out ASC-Live.apk aligned.apk
          fi
          "$BT/apksigner" verify ASC-Live.apk

      - name: Guardar o APK (arquivo de teste)
        uses: actions/upload-artifact@v4
        with:
          name: ASC-Live-apk
          path: asc-live-main/ASC-Live.apk

      - name: Publicar a Release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA=$(sha256sum ASC-Live.apk | cut -d' ' -f1)
          TAG="v${VERSION_CODE}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/ASC-Live.apk"
          printf '{"code": %s, "name": "%s", "url": "%s", "sha256": "%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$URL" "$SHA" > version.json
          cat version.json
          gh release create "$TAG" ASC-Live.apk version.json \
            --title "ASC Live ${VERSION_NAME}" \
            --notes "Versão ${VERSION_NAME}" --latest
